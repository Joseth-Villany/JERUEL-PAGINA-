<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#441E1E">
  <meta name="description" content="Inicia sesión en JERUEL, velas corporales artesanales para momentos de bienestar.">
  <title>Iniciar sesión | JERUEL</title>
  <link rel="stylesheet" href="css/identidad.css">
  <link rel="stylesheet" href="css/indexStyle.css">
  <link rel="icon" href="img/favicon.png" type="image/png">
  <script src="js/interfaz.js" defer></script>
</head>
<body>
  <main class="contenedor-inicio-sesion">
    <section class="seccion-marca" aria-label="Conoce JERUEL">
      <figure class="contenedor-logo-emblema">
        <img src="img/indexBackground.png"
             alt="Emblema de JERUEL sobre las velas de chocolate, frutos rojos y maracuyá"
             loading="eager" fetchpriority="high">
      </figure>
    </section>

    <section class="seccion-formulario" aria-labelledby="titulo-acceso">
      <header class="encabezado-formulario">
        <img class="marca-movil" src="img/logo.png" width="108" height="105" alt="JERUEL, velas corporales artesanales">
        <h1 id="titulo-acceso">Bienvenido de nuevo</h1>
        <p class="instruccion-formulario">Inicia sesión para continuar tu experiencia con JERUEL.</p>
      </header>

      <!-- Flujo de demostración: valida campos en el navegador, no autentica contra un servidor. -->
      <form class="formulario-acceso" id="formulario-acceso" action="homeScreen.html" method="get">
        <fieldset class="grupo-campo" aria-label="Identificación">
          <label for="identificador-usuario">Correo electrónico o nombre de usuario</label>
          <p class="contenedor-input-icono">
            <input id="identificador-usuario" type="text"
                   placeholder="Ingresa tu correo o usuario" autocomplete="username"
                   autocapitalize="none" spellcheck="false" required minlength="3">
            <svg class="icono-campo" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
          </p>
        </fieldset>

        <fieldset class="grupo-campo" aria-label="Contraseña">
            <label for="clave-acceso">Contraseña</label>
          <p class="contenedor-input-icono">
            <input id="clave-acceso" type="password"
                   placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
            <button type="button" class="boton-mostrar-contrasena" id="alternar-clave"
                    aria-label="Mostrar contraseña" aria-pressed="false" aria-controls="clave-acceso">
              <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </p>
        </fieldset>

        <button type="submit" class="boton-iniciar-sesion">
          INICIAR SESIÓN
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
        </button>
      </form>

      <footer class="pie-formulario" data-revelar>
        <p>¿Aún no tienes una cuenta? <a href="registro.html" class="enlace-registro">Crear cuenta</a></p>
      </footer>
    </section>
  </main>

  <script>
    const campoClave = document.getElementById('clave-acceso');
    const botonClave = document.getElementById('alternar-clave');
    botonClave.addEventListener('click', () => {
      const visible = campoClave.type === 'password';
      campoClave.type = visible ? 'text' : 'password';
      botonClave.setAttribute('aria-pressed', String(visible));
      botonClave.setAttribute('aria-label', visible ? 'Ocultar contraseña' : 'Mostrar contraseña');
    });

    document.getElementById('formulario-acceso').addEventListener('submit', (evento) => {
      evento.preventDefault();
      if (!evento.currentTarget.reportValidity()) return;
      // Navegación de prototipo: nunca incluir credenciales en la URL.
      try { sessionStorage.setItem('jeruel_sesion_demo', 'activa'); } catch { /* La tienda puede abrirse sin almacenamiento. */ }
      window.location.assign('homeScreen.html');
    });
  </script>
</body>
</html>
